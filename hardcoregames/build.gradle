plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
    id("com.gradleup.shadow") version "9.4.0"
}

group = 'br.dev.sno0s'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // Plugin
    compileOnly("io.papermc.paper:paper-api:26.2.build.124-stable")

    // SQLite (embutido no jar via shadowJar)
    implementation("org.xerial:sqlite-jdbc:3.45.3.0")

    // Testes
    testImplementation("io.papermc.paper:paper-api:26.2.build.124-stable")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.0")

    // Mockito (para JUnit 5)
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.23.0"

    // Registries and block physics matching Paper 26.2.
    testImplementation "org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1"

}

test {
    useJUnitPlatform()
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

shadowJar {
    // realoca o pacote para evitar conflito com outros plugins que usem SQLite
    relocate 'org.sqlite', 'br.dev.sno0s.hgplugin.libs.sqlite'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
