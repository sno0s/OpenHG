# Textos do plugin. Edite e reinicie o servidor para aplicar.
# Nomes e lores de itens e kits ficam em items.yml; menus em menus.yml;
# o loot do Feast em feast.yml. Chat e mensagens do Feast ficam neste arquivo.
# Cores: &0 a &f; estilos: &l (negrito), &o (itálico), &r (reset).
# {server-name} usa o nome abaixo; prefix aceita qualquer tag, ou "" para ocultar.
# Paleta: {msg}, {highlight}, {error}, {success}, {broadcast}.
# Preserve os parâmetros nomeados de cada mensagem, como {player} e {seconds}.
# Use "" em uma mensagem de chat para silenciá-la. Listas são linhas de descrição.
# Chaves ausentes são preenchidas na inicialização, preservando as personalizações.
server-name: "&cHardcore&fGames"
prefix: "&f[{server-name}&f] "

colors:
  broadcast: "&6"
  error: "&c"
  highlight: "&e"
  msg: "&f"
  success: "&a"
commands:
  kit:
    description: "Seleciona um kit para a partida."
    usage: "/kit <nome>"
  restarthg:
    description: "Reinicia o servidor via Crafty."
    usage: "/restarthg [check]"
  spawnfeast:
    description: "Spawn o Feast na localização do jogador (para testes)."
    usage: "/spawnfeast"
  startmatch:
    description: "Inicia jogo mesmo que não contenha nenhum jogador."
    usage: "/startmatch"
  stats:
    description: "Exibe estatísticas de um jogador."
    usage: "/stats [jogador]"
